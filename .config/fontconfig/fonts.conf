<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Prefer Noto Naskh for Arabic Sans-Serif -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Naskh Arabic UI</family>
    </prefer>
  </alias>

  <!-- Prefer Noto Naskh for Arabic Serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Naskh Arabic UI</family>
    </prefer>
  </alias>

  <!-- Force Noto Naskh Arabic for ANY Arabic script across the system -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic UI</string>
    </edit>
  </match>

</fontconfig>
