{
    match = "window_type = 'normal'";
    animations = (
        // ---------- CLOSE: quick fade + slight shrink, ease-in ----------
        {
            triggers = ["close"];
            opacity = {
                curve = "cubic-bezier(0.4,0,1,1)";
                duration = 0.4;
                start = "window-raw-opacity-before";
                end = 0;
            };
            blur-opacity = "opacity";
            shadow-opacity = "opacity";

            scale-x = {
                curve = "cubic-bezier(0.4,0,1,1)";
                duration = 0.4;
                start = 1;
                end = 0.94;
            };
            scale-y = {
                curve = "cubic-bezier(0.4,0,1,1)";
                duration = 0.4;
                start = 1;
                end = 0.94;
            };

            offset-x = "(1 - scale-x) / 2 * window-width";
            offset-y = "(1 - scale-y) / 2 * window-height";

            shadow-scale-x = "scale-x";
            shadow-scale-y = "scale-y";
            shadow-offset-x = "offset-x";
            shadow-offset-y = "offset-y";
        },

        // ---------- OPEN: fade + gentle zoom-in, ease-out (no overshoot) ----------
        {
            triggers = ["open"];
            opacity = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.85;
                start = 0;
                end = "window-raw-opacity";
            };
            blur-opacity = "opacity";
            shadow-opacity = "opacity";

            scale-x = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.85;
                start = 0.94;
                end = 1;
            };
            scale-y = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.85;
                start = 0.94;
                end = 1;
            };

            offset-x = "(1 - scale-x) / 2 * window-width";
            offset-y = "(1 - scale-y) / 2 * window-height";

            shadow-scale-x = "scale-x";
            shadow-scale-y = "scale-y";
            shadow-offset-x = "offset-x";
            shadow-offset-y = "offset-y";
        },

        // ---------- GEOMETRY: move/resize, snappy ease-out ----------
        {
            triggers = ["geometry"];
            scale-x = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.7;
                start = "window-width-before / window-width";
                end = 1;
            };
            scale-x-reverse = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.7;
                start = "window-width / window-width-before";
                end = 1;
            };
            scale-y = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.7;
                start = "window-height-before / window-height";
                end = 1;
            };
            scale-y-reverse = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.7;
                start = "window-height / window-height-before";
                end = 1;
            };
            offset-x = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.7;
                start = "window-x-before - window-x";
                end = 0;
            };
            offset-y = {
                curve = "cubic-bezier(0.16,1,0.3,1)";
                duration = 0.7;
                start = "window-y-before - window-y";
                end = 0;
            };

            shadow-scale-x = "scale-x";
            shadow-scale-y = "scale-y";
            shadow-offset-x = "offset-x";
            shadow-offset-y = "offset-y";
        }
    )
},
{
    match = "class_g = 'Dunst'";
    animations = (
        {
            triggers = ["close", "hide"];
            preset = "slide-out";
            direction = "up";
            duration = 0.15;
            scale = 0.5;
        },
        {
            triggers = ["open", "show"];
            preset = "slide-in";
            direction = "up";
            duration = 0.2;
            scale = 0.5;
        }
    )
},
