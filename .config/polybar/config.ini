[colors]
background = #2F4156 
background-alt = #373B41
foreground = #F5EFEB
primary = #C8D9E6
secondary = #567C8D
alert = #A54242
disabled = #707880

[bar/bar1]
wm-restack = i3
override-redirect = false 

font-0 = "JetBrainsMono Nerd Font:size=11;2"
font-1 = "Noto Kufi Arabic:size=13;2"

width = 99%
height = 22pt
radius = 9
offset-x = 0.25%
offset-y = 0.5%
fixed-center = true
bottom = false


; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

;border-size = 4pt
;border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

;separator = |
separator-foreground = ${colors.disabled}

modules-left = xwindow 
modules-center = i3
modules-right = pulseaudio backlight xkeyboard memory cpu hijri-date date systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active-font = 1
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰖀 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = 󰝟
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %essid%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 5

date = %H:%M
date-alt = %d/%m/%Y %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/backlight]
type = internal/backlight
card = amdgpu_bl1
use-actual-brightness = false

format = <label>
label = 󰳲 %percentage%%

[module/i3]
type = internal/i3

format = <label-state> <label-mode>
pin-workspaces = true
strip-wsnumbers = true
index-sort = true

[module/hijri-date]
type = custom/script
exec = ~/.local/bin/date-hijri-ar.php
interval = 60
label-active-font = 1
format-prefix-foreground = ${colors.primary}

; ─────────────────────────────
; ACTIVE WORKSPACE
; ─────────────────────────────
label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background-alt}
label-focused-padding = 4
label-focused-underline = ${colors.primary}
label-focused-underline-size = 2
label-focused-font = 1

; ─────────────────────────────
; UNFOCUSED WORKSPACES
; ─────────────────────────────
label-unfocused = %name%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 4
label-unfocused-font = 1

; ─────────────────────────────
; VISIBLE (OTHER MONITOR)
; ─────────────────────────────
label-visible = %name%
label-visible-foreground = ${colors.secondary}
label-visible-padding = 4
label-visible-font = 1

; ─────────────────────────────
; URGENT
; ─────────────────────────────
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 4
label-urgent-font = 1
